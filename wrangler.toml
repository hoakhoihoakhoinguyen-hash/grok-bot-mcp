name = "grok-bot-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Optional. Workers KV is not atomic. A Worker with only this binding
# refuses ask and reply until Upstash REST credentials are set.
# Create the namespace with `wrangler kv namespace create JOBS` and replace this id
# only if you still want the binding present. Upstash wins when its REST
# credentials exist.
[[kv_namespaces]]
binding = "JOBS"
id = "00000000000000000000000000000000"

[vars]
# Non-secret defaults. Put real values in `wrangler secret` (see README).
WAIT_SECONDS = "0"
JOB_TTL_SECONDS = "900"
MAX_MESSAGE_BYTES = "16384"
